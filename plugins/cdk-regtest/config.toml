# cdk-regtest plugin configuration
#
# Absorbed from the cdk repo's PoC harness (2026-08-10). Two trust domains:
#
#   [job.testing]   Executes arbitrary attack code against the target.
#                   Egress OFF by default: exploit code must never reach
#                   the internet (exfiltration + prompt-injection defense).
#
#   [job.research]  Reads the internet (CVE feeds, advisories, specs).
#                   Must never execute attack code. Egress ON by default.
#
# Toggle egress per job here, or per run: `arena.sh agent testing --egress`.
#
# Config parsing note: keep values flat (`key = "value"`, no `#` inside
# values). The minimal bash reader in arena.sh handles only this subset.
#
# [model] and [corpus] sections from the PoC config were NOT ported: they
# belonged to the Rust orchestrator, which opencode has superseded.

[arena]
# Internal (default-deny) network for the testing job.
network = "corpus-arena"
# NAT'd network with internet access, used only when egress is enabled.
egress_network = "corpus-arena-egress"

[target]
# Attacks run against the host regtest environment (`just regtest` in the
# cdk repo). Inside the arena, 127.0.0.1/localhost is rewritten to
# host.docker.internal; agents reach the targets via the corpus-target-gw
# gateway. Hard isolation lands when targets move into the arena themselves.
mint_url = "http://127.0.0.1:8085"
mint_url_2 = "http://127.0.0.1:8087"

[job.testing]
egress = false
memory = "8g"
cpus = "4"
pids_limit = "512"

[job.research]
egress = true
memory = "4g"
cpus = "2"
pids_limit = "256"

[faucet]
# Regtest Lightning faucet (host-side, CLN node "two"). Agents pay mint
# quotes and create melt-destination invoices through the plugin. Hard
# limits; the faucet additionally refuses any non-regtest invoice.
max_payment_sats = 100000

[sources]
# Pinned upstream source trees, mounted read-only at /opt/src/<name> in
# agent sandboxes — the attacker's research corpus (target source + spec).
# These are the DEFAULT shas; a mission rev-pin overrides them per sandbox
# start (CORPUS_SOURCE_SHA_<NAME> env, exported by the plugin from the
# resolved CORPUS_SOURCE_PINS). Probe verifies the running mint's version
# maps back to the default pin (fail loud rather than let agents read code
# that is not what they attack); missions pinned elsewhere are deliberate
# replay-against-another-version runs.
cdk_sha = "86a7c6cacb362daa67a0d636e303b66faf3965d9"
nuts_sha = "3bc8b6d5b160d4427cbde01b4cd1c782ce6a835a"