# Standalone crate (its own workspace + lock) so the plugin's Lightning dep
# tree stays isolated from the corpus workspace. Built host-native by
# setup.sh; the binary is copied to plugins/cdk-regtest/corpus-faucet.
[package]
name = "corpus-faucet"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "corpus-faucet"
path = "src/main.rs"

[dependencies]
cln-rpc = "0.7.0"
lightning-invoice = { version = "0.34", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

# Empty table: make this its own workspace root so cargo does not walk up
# into the corpus workspace (whose members are crates/*).
[workspace]
