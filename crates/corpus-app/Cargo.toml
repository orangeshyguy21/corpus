[package]
name = "corpus-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "corpus-app"
path = "src/main.rs"

[features]
# The embedded goose runtime backend for the management chat (dev/decisions.md).
# Default ON for operator builds (the app's native chat); headless builds opt out
# with `--no-default-features`, which ALSO drops the heavyweight goose dep tree
# (goose is an `optional = true` dependency below, gated behind this feature).
# With the feature OFF the chat backend is a no-op stub that reports a clear error.
default = ["chat-embed"]
chat-embed = [
    "dep:goose",
    "dep:tokio",
    "dep:tokio-util",
    "dep:anyhow",
    "dep:futures",
    "dep:rmcp",
    "dep:idna_adapter",
    "dep:icu_normalizer",
    "dep:icu_collections",
    "dep:icu_locale",
]

[dependencies]
corpus-core = { path = "../corpus-core" }
notify = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
# The embedded goose runtime (dev/decisions.md). Optional + gated on
# `chat-embed` so a headless `--no-default-features` build never compiles the
# goose tree. All goose types are quarantined inside `src/chat/embedded.rs`;
# the rest of the app sees only our own ChatEvent/ChatCommand/Chat types.
goose = { workspace = true, optional = true }
# Resolver pins for the goose git-dep's transitive ICU stack. goose's own lock
# resolves `idna_adapter = 1.2.1` (ICU 2.1.x) because goose pins `icu_locale =
# "=2.1.1"`; a FRESH resolve drags in `idna_adapter 1.2.2` → `icu_normalizer
# 2.2` → `icu_collections 2.2`, which conflicts with `icu_locale =2.1.1`.
# These exact pins force Cargo to the same ICU generation goose's lock uses.
# Revisit on a deliberate goose bump (dev/decisions.md "bumps are events").
idna_adapter = { version = "=1.2.1", optional = true }
icu_normalizer = { version = "=2.1.1", optional = true }
icu_collections = { version = "=2.1.1", optional = true }
icu_locale = { version = "=2.1.1", optional = true }
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
anyhow = { version = "1", optional = true }
# The chat backend runs its tokio runtime on a dedicated background thread
# (egui is sync); futures drives the reply stream (CancellationToken from
# tokio-util::sync is always available in 0.7, no feature gate).
futures = { version = "0.3", optional = true }
# MCP model types (Tool, CallToolResult) for the chat's `delegate` frontend
# tool — version-locked with goose's rmcp (a type-identity dependency, like
# the ICU pins above; revisit on a deliberate goose bump).
rmcp = { version = "3.0.0", default-features = false, optional = true }
eframe = { workspace = true }
egui = { workspace = true }
# Vendored per the deck-flow-plan table: egui_extras + egui-toast at
# chunk 1, egui_commonmark at chunk 4 (markdown preview), egui_term at
# chunk 7 (embedded terminal — published 0.1.0 matches workspace egui
# 0.31 exactly; no vendoring/patching needed).
egui_commonmark = { workspace = true }
egui_extras = { workspace = true }
egui-toast = { workspace = true }
egui_term = { workspace = true }
# Direct dep so the terminal pane can address the grid (scrollback mouse
# reports): must stay version-locked with egui_term's alacritty_terminal.
alacritty_terminal = "0.25"
egui-phosphor.workspace = true
image.workspace = true
# JSON and Markdown syntax highlighting in editable text areas: a
# layouter maps syntect token styles onto the theme's token colours. The
# degrade arm (plain monospace TextEdit) stays if syntect fights egui 0.31
# — see views/syntax_editor.rs.
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "default-syntaxes"] }
# GFM table splitting for the chat log (chat/tables.rs): pinned to the SAME
# 0.12 line egui_commonmark 0.20 parses with, so a segment boundary is exactly
# where that renderer would have drawn its own table.
pulldown-cmark = { version = "0.12", default-features = false }

[dev-dependencies]
# TEST-ONLY: the chat's tool tables (team.rs) must stay in step with the
# real admin catalog. The app spawns corpus-admin-mcp as a subprocess at
# runtime — the library is NOT a runtime dependency — but without this
# nothing catches a tool added to the server and never classified here,
# which silently withholds it from the specialists that should have it.
corpus-admin = { path = "../corpus-admin" }
