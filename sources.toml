# sources.toml — pinned upstream source manifest.
#
# The single source of truth for the DEFAULT pin per repo: "which code do
# agents read" when a mission doesn't say otherwise. SHAs are the pin (tags
# are mutable); the tag is recorded alongside for display and fetch.
# Fetched trees live git-ignored under sources/<name>/<sha>/ and are
# mounted read-only into agent sandboxes at /opt/src/<name>.
#
# Missions may pin ANY rev of a repo (the app dropdown discovers tags via
# `git ls-remote`, cached under sources/.rev-cache/): launching resolves
# rev → sha, fetches sources/<name>/<sha>/ when missing, and the sandbox
# is recreated when its mounts don't match the mission's pins.

# Target implementation: cdk-mintd. Pinned to the v0.18.0-rc.0 release-
# candidate commit, matching the version the regtest mints report on
# /v1/info (cdk-mintd/0.18.0-rc.0).
[sources.cdk]
repo = "cashubtc/cdk"
tag = "v0.18.0-rc.0"
sha = "4ecf992f031a37154ff9e651d029d7053608b37e"

# Cashu protocol spec (the NUTs the mint implements). Pinned to origin/main;
# the spec repo has no releases, so the branch tip is the reference.
[sources.nuts]
repo = "cashubtc/nuts"
tag = "main"
sha = "3bc8b6d5b160d4427cbde01b4cd1c782ce6a835a"