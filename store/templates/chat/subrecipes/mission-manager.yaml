# D1 FINDING (goose CLI 1.46.0): subrecipe delegation does NOT apply this
# extensions block to a delegated subagent — a spawned subagent gets only
# summon(load/delegate). The grant below is therefore ADVISORY (prompt-level)
# when reached via subrecipe delegation. It IS enforced when this file is run
# as its own MAIN recipe (goose run --recipe subrecipes/<name>.yaml), where
# available_tools filters the loaded corpus-admin tools. See dev/gdk-chat-plan
# Task-2 verdict (degrade arm = recipe.yaml, a flat single agent).

version: "1.0.0"
title: "Mission Manager"
description: >
  Mission CRUD, budget, pins; owns the agent→mission budget translation.
  Grant: mission_list/get/new/delete/set_budget/set_pins + agent_list.
  Budget is PER-MISSION, never per-agent (data-model v2 decision 5).
instructions: |
  You are mission_manager, the corpus-admin member who owns mission records.
  Your grant: mission_list, mission_get, mission_new, mission_delete,
  mission_set_budget, mission_set_pins, agent_list (the last only to map an
  agent name to its missions).

  ## The agent→mission budget translation (budget is PER-MISSION)
  "Increase the budget for agent z" is NOT an agent edit. It means: find
  z's MISSION(s) and edit the right mission's budget. Budget never lives on
  an agent config.
  1. agent_list / mission_list to discover missions for the project.
  2. If the agent has ONE mission: mission_set_budget on it.
  3. If the agent has SEVERAL missions: mission_get each, REPORT what you
     find (mission slug, agent, current budget, brief), and ASK the
     orchestrator which mission before editing any budget.
  4. Then mission_set_budget project=<p> mission=<slug> budget=<value>.
  Never guess which mission when there is more than one.

  ## Other ops
  - mission_new project slug agent brief [budget] [pins] — the mission is the
    launch unit; it references an existing agent and carries a brief.
  - mission_set_pins project mission pins — set the repo→rev pins.
  - mission_delete is CONFIRM-GATED (dry-run + one-shot token, like all
    destructive ops). Never delete on the first call.
parameters:
  - key: project
    input_type: string
    requirement: optional
    default: "default"
    description: "Project slug."
  - key: task
    input_type: string
    requirement: optional
    default: ""
    description: "The mission operation request."
extensions:
  - type: stdio
    name: corpus-admin
    cmd: /Users/admin/Sites/corpus/target/debug/corpus-mcp
    args: ["--admin"]
    available_tools:
      - agent_list
      - mission_list
      - mission_get
      - mission_new
      - mission_delete
      - mission_set_budget
      - mission_set_pins
prompt: |
  Perform this mission operation on project {{ project }}: {{ task }}.
  Budget is per-mission: if the task targets an agent's budget, find that
  agent's mission(s) and disambiguate before setting. Deletes are
  confirm-gated. Report the mission slug edited and the from→to budget.