name: external plugin compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: ${{ matrix.id }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cdk-regtest
            repo: orangeshyguy21/corpus-plugin-cdk
            archive: corpus-plugin-cdk
            version: 0.4.6
            sha256: 8c88e63b88721cd63d0cf957c920ba6288dfa83ffc2d01f25801f8dbf001e7ad
          - id: nutshell-regtest
            repo: orangeshyguy21/corpus-plugin-nutshell
            archive: corpus-plugin-nutshell
            version: 0.4.3
            sha256: f45670cdb0d09d0f11125f5e228554fdcd9de47885c510cd131a4e7e0179bcf0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Download and verify pinned plugin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ matrix.version }}" \
            --repo "${{ matrix.repo }}" \
            --pattern "${{ matrix.archive }}-${{ matrix.version }}.tar.gz" \
            --pattern "${{ matrix.archive }}-${{ matrix.version }}.tar.gz.sha256" \
            --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/${{ matrix.archive }}-${{ matrix.version }}.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum --check --strict "${{ matrix.archive }}-${{ matrix.version }}.tar.gz.sha256")
          printf '%s  %s\n' "${{ matrix.sha256 }}" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Install downloaded immutable bundle and negotiate protocol v1
        shell: bash
        run: |
          set -euo pipefail
          export CORPUS_HOME="$RUNNER_TEMP/local-bundle-home"
          plugin="$RUNNER_TEMP/${{ matrix.archive }}-${{ matrix.version }}"
          cargo run --locked --quiet -p corpus-cli -- plugin install-local "$plugin"
          cargo run --locked --quiet -p corpus-cli -- plugin list | tee "$RUNNER_TEMP/plugin-list.txt"
          grep -F "${{ matrix.id }}" "$RUNNER_TEMP/plugin-list.txt"
          hello="$(cargo run --locked --quiet -p corpus-cli -- plugin call "${{ matrix.id }}" hello)"
          jq -e '.protocol == "corpus.environment/1"' <<<"$hello"
      - name: Exercise the public catalog installation path
        shell: bash
        run: |
          set -euo pipefail
          export CORPUS_HOME="$RUNNER_TEMP/catalog-home"
          receipt="$(cargo run --locked --quiet -p corpus-cli -- plugin install "${{ matrix.id }}")"
          grep -F "installed ${{ matrix.id }}@${{ matrix.version }}" <<<"$receipt"
          hello="$(cargo run --locked --quiet -p corpus-cli -- plugin call "${{ matrix.id }}" hello)"
          jq -e '.protocol == "corpus.environment/1"' <<<"$hello"
      - name: Run language-neutral protocol conformance
        run: cargo test --locked -p corpus-core --test protocol
