[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
eframe = "0.31"
egui = "0.31"
egui_commonmark = "0.20"
egui_extras = "0.31"
egui-toast = "0.17"
egui_term = "0.1"
egui-phosphor = "0.9"
image = "0.25"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
goose = { git = "https://github.com/aaif-goose/goose", rev = "4bb968fadbb1d8fc0216adad627a1ab7837803c5" }

[profile.release]
lto = true
