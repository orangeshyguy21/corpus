[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
eframe = "0.31"
egui = "0.31"
egui_commonmark = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[profile.release]
lto = true
